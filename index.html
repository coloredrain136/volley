<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Volley">
<meta name="theme-color" content="#eef1f8">
<script>
// Set light/dark and the iPhone top bar before anything draws. iOS reads the top-bar style when the
// app opens, so it has to be right from the first moment (changing it later doesn't take).
(function () {
  try {
    var p = JSON.parse(localStorage.getItem('volley.prefs') || '{}'), t = p.theme || 'light';
    if (t === 'auto') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    var d = t === 'dark';
    document.documentElement.setAttribute('data-theme', t);
    document.querySelector('meta[name=theme-color]').setAttribute('content', d ? '#0c0e18' : '#eef1f8');
    document.querySelector('meta[name=apple-mobile-web-app-status-bar-style]').setAttribute('content', d ? 'black-translucent' : 'default');
  } catch (e) {}
})();
</script>
<title>Volley</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/favicon.png">
<style>
:root{
  --bg:#eef1f8; --blob1:#b9c6ff; --blob2:#f5c3e1; --blob3:#bfe9f2;
  --glass:rgba(255,255,255,.55); --glass-2:rgba(255,255,255,.78); --glass-3:rgba(255,255,255,.35);
  --stroke:rgba(255,255,255,.75); --hair:rgba(24,32,70,.08); --hair-2:rgba(24,32,70,.14);
  --text:#121630; --sub:#5d6483; --faint:#8f95ad;
  --accent:#5b6cff; --accent-2:#9b5cff; --accent-ink:#fff; --accent-soft:rgba(91,108,255,.14);
  --good:#1fae79; --warn:#f29a1f; --bad:#f2445f;
  --shadow:0 10px 30px rgba(40,50,120,.12), 0 1px 2px rgba(40,50,120,.08);
  --shadow-lg:0 24px 60px rgba(40,50,120,.18);
  --hl:inset 0 1px 0 rgba(255,255,255,.9);
  --blur:saturate(180%) blur(22px);
  --r-lg:26px; --r-md:18px; --r-sm:12px;
  --sq-light:#f4eee4; --sq-dark:#8a95b8; --sq-dark-2:#7884aa;
  --safe-t:env(safe-area-inset-top); --safe-b:env(safe-area-inset-bottom);
  --tabbar:68px;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0c0e18; --blob1:#2b2f7a; --blob2:#5a2251; --blob3:#123e4c;
  --glass:rgba(34,38,60,.55); --glass-2:rgba(44,48,74,.82); --glass-3:rgba(255,255,255,.06);
  --stroke:rgba(255,255,255,.10); --hair:rgba(255,255,255,.08); --hair-2:rgba(255,255,255,.14);
  --text:#eef0fb; --sub:#a5abc8; --faint:#737a99;
  --accent:#7c8bff; --accent-2:#b07cff; --accent-soft:rgba(124,139,255,.18);
  --shadow:0 10px 30px rgba(0,0,0,.35), 0 1px 2px rgba(0,0,0,.3);
  --shadow-lg:0 24px 60px rgba(0,0,0,.5);
  --hl:inset 0 1px 0 rgba(255,255,255,.08);
  --sq-light:#c9c3ba; --sq-dark:#3f4766; --sq-dark-2:#363d5a;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior:none}
body{overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text;font:inherit;color:inherit}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
[hidden]{display:none!important}

/* Wallpaper */
.bg{position:fixed;inset:-20%;z-index:0;pointer-events:none;
  background:
   radial-gradient(40% 35% at 18% 18%, var(--blob1), transparent 70%),
   radial-gradient(38% 32% at 86% 30%, var(--blob2), transparent 70%),
   radial-gradient(45% 40% at 40% 92%, var(--blob3), transparent 70%),
   var(--bg)}

/* Glass */
.glass{background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  border:1px solid var(--stroke);box-shadow:var(--shadow),var(--hl)}
.card{border-radius:var(--r-lg);padding:16px}

/* Main scroller */
#view{position:fixed;inset:0;z-index:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:calc(var(--safe-t) + 14px) 16px calc(var(--tabbar) + var(--safe-b) + 34px)}
.page{max-width:560px;margin:0 auto}
.page.enter{animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h1{font-size:34px;letter-spacing:-.02em;margin:8px 4px 16px;font-weight:800}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--sub);font-weight:700;margin:22px 8px 8px;display:flex;align-items:center;gap:8px}
h2 .count{background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:1px 7px;font-size:11px}
.sub{color:var(--sub)} .faint{color:var(--faint)}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Tab bar */
#tabs{position:fixed;z-index:5;left:16px;right:16px;bottom:calc(var(--safe-b) + 10px);height:var(--tabbar);
  max-width:520px;margin:0 auto;border-radius:34px;display:grid;grid-template-columns:repeat(4,1fr);padding:6px}
#tabs .ind{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/4);border-radius:28px;
  background:var(--glass-2);box-shadow:var(--hl),0 2px 8px rgba(40,50,120,.08);transition:transform .35s cubic-bezier(.3,1.3,.5,1)}
#tabs button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:11px;font-weight:600;color:var(--sub);border-radius:28px;transition:color .2s}
#tabs button.on{color:var(--accent)}
#tabs svg{width:24px;height:24px}
#tabs .dot{position:absolute;top:6px;right:calc(50% - 20px);min-width:17px;height:17px;border-radius:9px;background:var(--bad);color:#fff;
  font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 20px;border-radius:25px;
  font-weight:650;font-size:16px;transition:transform .12s ease, opacity .2s;background:var(--glass-2);border:1px solid var(--stroke);box-shadow:var(--hl),0 2px 10px rgba(40,50,120,.06)}
.btn:active,.press:active{transform:scale(.96)}
.btn svg{width:20px;height:20px;flex:none}
.chat-btn{position:relative}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--accent-ink);border-color:transparent;
  box-shadow:0 8px 22px rgba(91,108,255,.35), inset 0 1px 0 rgba(255,255,255,.35)}
.btn.danger{color:var(--bad)}
.btn.block{width:100%}
.btn.sm{height:38px;padding:0 14px;font-size:14px;border-radius:19px}
.btn[disabled]{opacity:.45;pointer-events:none}
.icon-btn{width:44px;height:44px;border-radius:22px;display:inline-flex;align-items:center;justify-content:center;position:relative}
.icon-btn svg{width:22px;height:22px}
.badge{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px;border:2px solid var(--bg)}

/* Game cards */
.list{display:flex;flex-direction:column;gap:10px}
.gcard{display:flex;align-items:center;gap:14px;padding:12px 14px 12px 12px;border-radius:22px;width:100%;text-align:left;transition:transform .12s}
.gcard:active{transform:scale(.98)}
.thumb{width:58px;height:58px;border-radius:14px;flex:none;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.thumb svg{display:block;width:100%;height:100%}
.gtitle{font-weight:700;font-size:17px;display:flex;align-items:center;gap:6px}
.gline{font-size:14px;color:var(--sub);margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:10px;padding:2px 8px;font-size:12px;font-weight:650;background:var(--accent-soft);color:var(--accent)}
.pill.warn{background:rgba(242,154,31,.15);color:var(--warn)} .pill.bad{background:rgba(242,68,95,.14);color:var(--bad)}
.pill.good{background:rgba(31,174,121,.15);color:var(--good)} .pill.grey{background:var(--hair);color:var(--sub)}
.unread{width:10px;height:10px;border-radius:5px;background:var(--accent);flex:none;box-shadow:0 0 0 3px var(--accent-soft)}
.chev{color:var(--faint);flex:none}
.empty{text-align:center;padding:42px 22px;border-radius:30px;margin-top:30px}
.empty .big{font-size:64px;line-height:1;margin-bottom:12px}
.empty h3{font-size:24px;margin:0 0 6px}
.more-link{display:block;margin:6px auto 0;color:var(--accent);font-weight:600;font-size:15px;padding:10px}

/* Forms / settings */
.group{border-radius:var(--r-lg);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;min-height:56px;padding:10px 16px;width:100%;text-align:left}
.item + .item{border-top:1px solid var(--hair)}
.item .lbl{flex:1;font-weight:550}
.item .val{color:var(--sub);font-size:15px}
.switch{position:relative;width:52px;height:32px;border-radius:16px;background:var(--hair-2);transition:background .25s;flex:none}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:28px;height:28px;border-radius:14px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .25s cubic-bezier(.3,1.3,.5,1)}
.switch.on{background:var(--good)} .switch.on::after{transform:translateX(20px)}
.seg{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:3px;border-radius:14px;background:var(--hair);gap:2px}
.seg button{height:34px;border-radius:11px;font-size:14px;font-weight:600;color:var(--sub);position:relative;z-index:1;transition:color .2s}
.seg button.on{color:var(--text);background:var(--glass-2);box-shadow:0 2px 8px rgba(0,0,0,.08),var(--hl)}
.field{width:100%;height:52px;border-radius:16px;border:1px solid var(--hair-2);background:var(--glass-2);padding:0 16px;font-size:17px;outline:none}
.field:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:12px}
.emoji-grid button{aspect-ratio:1;border-radius:12px;font-size:24px;display:flex;align-items:center;justify-content:center;transition:transform .12s}
.emoji-grid button.on{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.emoji-grid button:active{transform:scale(.88)}

/* New game */
.picker{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.gtile{border-radius:22px;padding:14px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:700;font-size:15px;position:relative;transition:transform .15s, box-shadow .2s}
.gtile .art{width:62px;height:62px;border-radius:16px;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.14)}
.gtile .art svg{width:100%;height:100%;display:block}
.gtile.on{box-shadow:0 0 0 2.5px var(--accent),var(--shadow)}
.gtile.soon{opacity:.55}
.gtile small{font-size:11px;color:var(--sub);font-weight:600;margin-top:-4px}
.optrow{display:flex;flex-direction:column;gap:8px;padding:14px 16px}
.optrow + .optrow{border-top:1px solid var(--hair)}
.optrow .lbl{font-weight:600}
.optrow .hint{font-size:13px;color:var(--sub)}

/* Stats */
.h2h{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;padding:22px 12px}
.h2h .av{font-size:44px;line-height:1}
.h2h .nm{font-weight:650;margin-top:6px}
.h2h .w{font-size:44px;font-weight:800;letter-spacing:-.03em;margin-top:4px}
.h2h .vs{font-size:13px;color:var(--faint);font-weight:700}
.statrow{display:flex;align-items:center;gap:12px;padding:14px 16px}
.statrow + .statrow{border-top:1px solid var(--hair)}
.bar{height:8px;border-radius:4px;background:var(--hair);overflow:hidden;display:flex;margin-top:8px}
.bar i{display:block;height:100%}

/* Screens (game) */
.screen{position:fixed;inset:0;z-index:10;overflow:hidden;display:flex;flex-direction:column;background:transparent;
  transform:translateX(100%);transition:transform .38s cubic-bezier(.2,.9,.25,1);will-change:transform}
.screen.open{transform:none}
.screen .bg{position:absolute}
.topbar{position:relative;z-index:2;display:flex;align-items:center;gap:10px;padding:calc(var(--safe-t) + 4px) 12px 6px}
.topbar .icon-btn{width:40px;height:40px;border-radius:20px}
.topbar .t{flex:1;text-align:center;min-width:0}
.topbar .t b{display:block;font-size:17px;letter-spacing:-.01em}
.topbar .t span{display:block;font-size:12px;color:var(--sub)}
.topbar .t span:empty{display:none}
/* blends the phone's status bar into the page so there's no hard line at the top */
.topfade{position:fixed;left:0;right:0;top:0;height:calc(var(--safe-t) + 110px);background:linear-gradient(180deg,var(--bg) 0,var(--bg) calc(var(--safe-t) + 2px),transparent 100%);z-index:0;pointer-events:none}
.screen .topfade{position:absolute;z-index:1}
.gbody{position:relative;z-index:1;flex:1;overflow-y:auto;padding:4px 16px calc(var(--safe-b) + 18px);display:flex;flex-direction:column;align-items:center;gap:10px}
.gbody > *{width:100%;max-width:480px}
.pbar{display:flex;align-items:center;gap:10px;padding:8px 12px 8px 8px;border-radius:20px;transition:box-shadow .3s}
.pbar .av{width:40px;height:40px;border-radius:20px;background:var(--glass-2);display:flex;align-items:center;justify-content:center;font-size:24px;flex:none}
.pbar .nm{font-weight:700}
.pbar .meta{font-size:12.5px;color:var(--sub);display:flex;align-items:center;gap:6px}
.pbar.turn{box-shadow:0 0 0 2px var(--accent),0 0 24px rgba(91,108,255,.35),var(--hl)}
.chip-dot{width:12px;height:12px;border-radius:6px;display:inline-block}
.banner{border-radius:20px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;animation:fade .25s}
.banner .msg{font-weight:600;text-align:center}
.banner .acts{display:flex;gap:8px}
.banner .acts .btn{flex:1;height:42px}
.actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.actions .btn{height:42px;font-size:14.5px;padding:0 14px;border-radius:21px}
.actions .btn svg{width:18px;height:18px}

/* Board */
.board-wrap{padding:8px;border-radius:22px}
.board{position:relative;width:100%;aspect-ratio:1;border-radius:14px;overflow:hidden;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);touch-action:manipulation}
.sq{position:relative;background:var(--sq-light)}
.sq.d{background:linear-gradient(145deg,var(--sq-dark),var(--sq-dark-2))}
.sq.last::before{content:"";position:absolute;inset:0;background:rgba(255,214,90,.32)}
.sq.sel::before{content:"";position:absolute;inset:0;background:rgba(124,139,255,.45)}
.sq.dest::after{content:"";position:absolute;left:50%;top:50%;width:30%;height:30%;margin:-15% 0 0 -15%;border-radius:50%;background:rgba(255,255,255,.75);box-shadow:0 0 0 3px rgba(91,108,255,.5)}
.sq.must::before{content:"";position:absolute;inset:4%;border-radius:50%;box-shadow:0 0 0 3px rgba(255,214,90,.95),0 0 14px rgba(255,214,90,.8);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.pieces{position:absolute;inset:0;pointer-events:none}
.pc{position:absolute;left:0;top:0;width:12.5%;height:12.5%;transition:transform .22s cubic-bezier(.3,.8,.3,1),opacity .25s;will-change:transform}
.pc i{position:absolute;inset:11%;border-radius:50%;display:flex;align-items:center;justify-content:center}
.pc.r i{background:radial-gradient(circle at 35% 30%,#ff8a8f,#e02b48 55%,#a8122d);box-shadow:0 3px 0 #7d0b20,0 5px 10px rgba(0,0,0,.35),inset 0 0 0 3px rgba(255,255,255,.18)}
.pc.k i{background:radial-gradient(circle at 35% 30%,#6c7183,#262935 55%,#101117);box-shadow:0 3px 0 #050507,0 5px 10px rgba(0,0,0,.4),inset 0 0 0 3px rgba(255,255,255,.12)}
.pc i::before{content:"";position:absolute;inset:18%;border-radius:50%;border:2px solid rgba(255,255,255,.18)}
.pc svg{width:52%;height:52%;position:relative;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}
.pc.gone{opacity:0;transform-origin:center}
.pc.lift i{transform:translateY(-6%) scale(1.06);transition:transform .15s}
.board.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* Sheets */
.backdrop{position:fixed;inset:0;z-index:20;background:rgba(10,14,30,.28);opacity:0;transition:opacity .3s;pointer-events:none}
.backdrop.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:600px;margin:0 auto;border-radius:30px 30px 0 0;
  padding:8px 16px calc(var(--safe-b) + 16px);transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.9,.25,1);
  background:var(--glass-2);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--stroke);box-shadow:var(--shadow-lg);max-height:88dvh;display:flex;flex-direction:column}
.sheet.open{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--hair-2);margin:2px auto 10px;flex:none}
.sheet h3{margin:4px 4px 12px;font-size:20px}
.menu{display:flex;flex-direction:column;gap:8px}
.menu .btn{justify-content:flex-start;height:54px;border-radius:18px}

/* Chat */
.chat{height:72dvh}
.msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:4px 2px 10px;-webkit-user-select:text;user-select:text}
.bub{max-width:78%;padding:9px 13px;border-radius:20px;font-size:16px;line-height:1.3;word-wrap:break-word;white-space:pre-wrap;animation:pop .2s ease}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
.bub.me{align-self:flex-end;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;border-bottom-right-radius:6px}
.bub.them{align-self:flex-start;background:var(--glass);border:1px solid var(--stroke);border-bottom-left-radius:6px}
.stamp{text-align:center;font-size:11.5px;color:var(--faint);margin:8px 0 2px}
.composer{display:flex;gap:8px;align-items:flex-end;padding-top:8px;border-top:1px solid var(--hair)}
.composer textarea{flex:1;resize:none;max-height:120px;min-height:44px;border-radius:22px;border:1px solid var(--hair-2);background:var(--glass);padding:11px 16px;font-size:16px;outline:none}
.send{width:44px;height:44px;border-radius:22px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.send svg{width:20px;height:20px}

/* Lock / setup */
#gate{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:24px}
.gate-card{width:100%;max-width:400px;border-radius:32px;padding:28px 22px;text-align:center;animation:fade .3s}
.logo{width:84px;height:84px;border-radius:22px;margin:0 auto 14px;box-shadow:0 12px 30px rgba(91,108,255,.35);display:block}
.gate-card h1{margin:0 0 4px;font-size:30px}
.gate-card p{margin:0 0 18px;color:var(--sub)}
.who{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.who button{border-radius:24px;padding:20px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700}
.who .e{font-size:46px;line-height:1}
.who .add{width:52px;height:52px;border-radius:26px;border:2px dashed var(--hair-2);display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--faint)}
.shake{animation:shake .3s}

/* Test mode */
.testpill{position:fixed;z-index:6;top:calc(var(--safe-t) + 12px);right:14px;display:flex;align-items:center;gap:7px;height:36px;padding:0 12px;border-radius:18px;font-size:13px;color:var(--text);
  box-shadow:0 0 0 1.5px #f29a1f,var(--shadow)}
.testpill i{font-style:normal;font-size:10px;font-weight:800;letter-spacing:.08em;color:#fff;background:#f29a1f;border-radius:7px;padding:2px 5px}
.testpill b{font-weight:750}.testpill span{color:var(--sub);font-weight:700}
.gswitch{flex-direction:column;gap:0;line-height:1;box-shadow:0 0 0 1.5px #f29a1f,var(--shadow)}
.gswitch span{font-size:17px}.gswitch small{font-size:9px;font-weight:800;color:var(--sub);margin-top:1px}
/* Toast */

function appOutdated(sv) {

  try { tried = sessionStorage.getItem('volley.reload') === sv; sessionStorage.setItem('volley.reload', sv); } catch {}
  if (tried) { toast('Volley updated. Close the app fully and reopen it.', 5000); return; }
  location.reload();
}
async function call(path, action, data = {}) {
  let r;
  try {
    r = await fetch(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-volley-key': S.key, 'x-volley-player': S.me || '', 'x-volley-version': VERSION, ...(S.dev ? { 'x-volley-dev': S.dev } : {}), ...(testMode() ? { 'x-volley-space': 'test' } : {}) },
      body: JSON.stringify({ action, ...data }),
    });
  } catch (e) { const err = new Error('offline'); err.status = 0; throw err; }
  const sv = r.headers.get('x-volley-version');
  if (sv && sv !== VERSION) appOutdated(sv);
  let j = {};
  try { j = await r.json(); } catch {}
  if (!r.ok) { const err = new Error(j.error || 'HTTP ' + r.status); err.status = r.status; throw err; }
  return j;
}
const api = (action, data) => call('/api/db', action, data).catch((e) => {
  if (e.status === 401) { lockDevice(true); }
  throw e;
});
const pushApi = (action, data) => call('/api/push', action, data);

function errText(e) {
  const m = e && e.message;
  return ({
    offline: "Can't reach Volley. Check your connection.",
    game_changed: 'The game changed. Refreshed it for you.',
    not_your_turn: "It's not your turn anymore.",
    nudged_recently: 'You already nudged in the last hour.',
    request_pending: "There's already a request waiting.",
    nothing_to_undo: 'Nothing to take back.',
    cannot_delete: "This game can't be deleted. Cancel or decline the invite instead.",
    test_mode: "Notifications are off in test mode.",
    game_not_found: 'That game was deleted.',
    update_required: 'Volley just updated. Reloading…',
    not_configured: 'Server not set up yet. Add the env vars in Vercel and redeploy.',
    push_not_configured: 'Push keys are missing on the server.',
    dev_not_configured: 'Add VOLLEY_DEV_CODE in Vercel and redeploy first.',
    bad_dev_code: "That developer code isn't right.",
  })[m] || 'Something went wrong (' + m + ')';
}

let toastT;
function toast(msg, ms = 2400) {

}

function gatePasscode(msg) {

function gateWho() {
  const tile = (p) => {

function lockDevice(badKey) {

  store.del('key'); store.del('me'); store.del('games'); store.del('dev'); S.dev = '';

async function refreshList() {
  try {
    const r = await api('list');
    S.players = r.players; S.games = r.games; S.unread = r.unread; S.requests = r.requests; S.vapid = r.vapid; S.push = r.push;
    if (r.defaults) { S.defaults = Object.assign({ holes: 9, max: 8, timer: 0, hints: true }, r.defaults); store.set('defaults', S.defaults); }
    store.set('players', S.players); store.set('games', S.games); store.set('vapid', S.vapid);
    if (!S.players[S.me]) {
      if (testMode()) { const t = await api('dev_test_setup'); S.players = t.players; store.set('players', S.players); }
      else { stopPolling(); closeGame(true); store.del('me'); S.me = ''; gateWho(); return; }
    }
    paintTestPill();
    if (S.tab === 'games' || S.tab === 'stats') renderTab();
    updateBadges();
  } catch (e) { if (e.status !== 401 && S.tab === 'games') renderTab(); }
}
function sections() {
  const me = S.me, g = S.games;
  const yourTurn = g.filter((x) => x.status === 'active' && x.turn === me);
  const invites = g.filter((x) => x.status === 'invited').sort((a, b) => (a.created_by === me) - (b.created_by === me));
  const theirTurn = g.filter((x) => x.status === 'active' && x.turn !== me);
  const finished = g.filter((x) => x.status === 'finished').sort((a, b) => new Date(b.finished_at || b.updated_at) - new Date(a.finished_at || a.updated_at));
  return { yourTurn, invites, theirTurn, finished };
}
function updateBadges() {
  const s = sections();
  const n = s.yourTurn.length + s.invites.filter((x) => x.created_by !== S.me).length;
  const unread = Object.values(S.unread || {}).reduce((a, b) => a + b, 0);
  const dot = $('#tabs [data-tab=games] .dot');
  const total = n;
  if (dot) { dot.hidden = !total; dot.textContent = total; }
  try { if (navigator.setAppBadge) { (n + unread) ? navigator.setAppBadge(n + unread) : navigator.clearAppBadge(); } } catch {}
}

/* Only touch the screen when something actually changed. Fade in only when switching tabs. */
let lastPaint = { tab: null, html: '' };
function paint(html) {
  if (lastPaint.tab === S.tab && lastPaint.html === html) return;
  const v = $('#view'), switched = lastPaint.tab !== S.tab, y = v.scrollTop;

  v.innerHTML = html;

  if (switched) { if (pg) pg.classList.add('enter'); v.scrollTop = 0; } else v.scrollTop = y;
}

// fixed gradient ids on purpose: the same icon twice on a page is identical, and the Games list only

const icon = (type) => GAME_ICON[type] || GAME_ICON.golf;
function thumb(g) {
  if (g.type === 'checkers' && g.state && Array.isArray(g.state.board) && g.status !== 'invited') {
    const board = g.state.board;
    const flip = g.state.colors && g.state.colors[S.me] === 'k';
    let s = '<svg viewBox="0 0 80 80">';
    for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
      const dark = (r + c) % 2 === 1;
      s += `<rect x="${c * 10}" y="${r * 10}" width="10" height="10" fill="${dark ? '#8a95b8' : '#f4eee4'}"/>`;
    }
    board.forEach((p, i) => {
      if (!p) return; let r = i >> 3, c = i & 7; if (flip) { r = 7 - r; c = 7 - c; }
      s += `<circle cx="${c * 10 + 5}" cy="${r * 10 + 5}" r="3.8" fill="${p.c === 'r' ? '#e02b48' : '#22252f'}" ${p.k ? 'stroke="#ffd45a" stroke-width="1.4"' : ''}/>`;
    });
    return s + '</svg>';
  }
  return icon(g.type);
}
const GNAME = { checkers: 'Checkers', chess: 'Chess', golf: 'Mini Golf', pool: '8-Ball' };

function gameLine(g) {
  const me = S.me, them = nameOf(opp());
  if (g.status === 'invited') return g.created_by === me ? `Invite sent · waiting on ${esc(them)}` : `${esc(them)} invited you`;
  if (g.status === 'active') return g.turn === me ? `Your move · ${ago(g.last_move_at)}` : `Waiting on ${esc(them)} · ${ago(g.last_move_at)}`;
  if (g.winner === 'draw') return 'Draw';
  const why = g.end_reason === 'resign' ? ' · resigned' : g.end_reason === 'timeout' ? ' · timer ran out' : '';
  return (g.winner === me ? 'You won' : `${esc(them)} won`) + why + ` · ${ago(g.finished_at)}`;
}
function gameCard(g) {
  const unread = S.unread[g.id];
  const req = S.requests.find((r) => r.game_id === g.id && r.from_player !== S.me);
  let chip = '';
  if (g.status === 'active' && g.turn_deadline) {
    const h = hoursLeft(g.turn_deadline);
    chip = `<span class="pill ${h < 3 ? 'bad' : h < 12 ? 'warn' : 'grey'}">⏱ ${left(g.turn_deadline)}</span>`;
  }
  if (req) chip = `<span class="pill warn">${({ undo: 'Undo request', draw: 'Draw offer', delete: '🗑️ Wants to delete' })[req.kind] || 'Request'}</span>`;
  if (g.status === 'invited' && g.created_by !== S.me) chip = '<span class="pill">New</span>';
  if (g.status === 'finished' && !req) chip = g.winner === S.me ? '<span class="pill good">Win</span>' : g.winner === 'draw' ? '<span class="pill grey">Draw</span>' : '<span class="pill bad">Loss</span>';
  return `<button class="gcard glass" data-open="${g.id}">
    <div class="thumb">${thumb(g)}</div>
    <div class="grow">
      <div class="gtitle">${GNAME[g.type] || g.type} <span style="font-size:15px">${esc(emojiOf(opp()))}</span></div>
      <div class="gline ellipsis">${gameLine(g)}</div>
      ${chip ? `<div style="margin-top:6px">${chip}</div>` : ''}
    </div>
    ${unread ? '<span class="unread" aria-label="unread messages"></span>' : ''}
    <span class="chev">${I.chev}</span>
  </button>`;
}

function computeStats() {

  const st = { a: 0, b: 0, draw: 0, by: {}, longest: { a: 0, b: 0 }, cur: { p: null, n: 0 } };

  for (const g of fin) {
    const t = (st.by[g.type] = st.by[g.type] || { a: 0, b: 0, draw: 0 });
    if (g.winner === 'draw') { st.draw++; t.draw++; run = { p: null, n: 0 }; continue; }
    if (g.winner !== 'a' && g.winner !== 'b') continue;

// Board: 64 squares, index = row*8 + col. Playable squares: (row+col) odd.
// 'r' = Red, moves first, starts on rows 5-7 and moves up. 'k' = Black, rows 0-2, moves down.
const CK = {
  init() {

    for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
      if ((r + c) % 2 !== 1) continue;
      if (r < 3) b[r * 8 + c] = { id: 'k' + n++, c: 'k', k: false };
      else if (r > 4) b[r * 8 + c] = { id: 'r' + n++, c: 'r', k: false };
    }
    return b;
  },
  dirs(p) { const f = p.c === 'r' ? -1 : 1; return p.k ? [[-1, -1], [-1, 1], [1, -1], [1, 1]] : [[f, -1], [f, 1]]; },
  kingRow(p) { return p.c === 'r' ? 0 : 7; },
  // b has the moving piece already lifted off its start square; caps = squares captured so far (can't be jumped twice or landed on)
  jumps(b, from, p, caps) {
    const r0 = from >> 3, c0 = from & 7, out = [];
    for (const [dr, dc] of this.dirs(p)) {
      const r2 = r0 + 2 * dr, c2 = c0 + 2 * dc;
      if (r2 < 0 || r2 > 7 || c2 < 0 || c2 > 7) continue;
      const mid = (r0 + dr) * 8 + (c0 + dc), to = r2 * 8 + c2, m = b[mid];
      if (!m || m.c === p.c || caps.includes(mid) || b[to]) continue;
      const nc = caps.concat(mid);
      const crowned = !p.k && r2 === this.kingRow(p); // reaching the king row ends the turn
      const more = crowned ? [] : this.jumps(b, to, p, nc);
      if (more.length) more.forEach((s) => out.push({ path: [from].concat(s.path), caps: s.caps }));
      else out.push({ path: [from, to], caps: nc });
    }
    return out;
  },
  moves(b, color) {
    const jumps = [], steps = [];
    for (let i = 0; i < 64; i++) {
      const p = b[i]; if (!p || p.c !== color) continue;
      const lifted = b.slice(); lifted[i] = null;
      jumps.push(...this.jumps(lifted, i, p, []));
      for (const [dr, dc] of this.dirs(p)) {
        const r = (i >> 3) + dr, c = (i & 7) + dc;
        if (r < 0 || r > 7 || c < 0 || c > 7) continue;
        if (!b[r * 8 + c]) steps.push({ path: [i, r * 8 + c], caps: [] });
      }
    }
    return jumps.length ? jumps : steps; // jumps are forced
  },
  apply(b, m) {
    const nb = b.slice(), p = { ...nb[m.path[0]] };
    nb[m.path[0]] = null; m.caps.forEach((x) => (nb[x] = null));
    const to = m.path[m.path.length - 1];
    const crowned = !p.k && (to >> 3) === this.kingRow(p);
    if (crowned) p.k = true;
    nb[to] = p;
    return { board: nb, crowned };
  },
  count(b, color) { return b.filter((p) => p && p.c === color).length; },
};

      P.balls = st.balls.map((b) => ({ ...b })); P.cue = P.balls.find((b) => b.n === 0);
      P.canPlay = controls;
      P.inHand = P.canPlay && st.inHand;
      if (P.inHand) Pool.freeSpot(P, st);
      if (P.canPlay) {
        P.aim = Pool.defaultAim(P, st);
        const tip = P.inHand ? (st.isBreak ? 'Your break! Drag the white ball behind the line.' : 'Ball in hand: drag the white ball.') : 'Tap the table to aim. Pull the bar down to shoot.';
        pgOverlay(tip); P.t2 = setTimeout(() => PG === P && pgOverlay(''), 2600);
      } else if (g.status === 'active') pgHint(`Waiting on ${nameOf(o)}…`);
      P.draw();
    };
    if (list.length) Pool.replay(P, g, list, start); else start();
  },
  defaultAim(P, st) {
    const cue = P.cue, legal = poolLegalTargets(st, S.me); let best = null, bd = Infinity;
    for (const b of P.balls) if (b.on && legal.includes(b.n)) { const d = (b.x - cue.x) ** 2 + (b.y - cue.y) ** 2; if (d < bd) { bd = d; best = b; } }
    if (!best) return { x: 0, y: -1 };
    const dx = best.x - cue.x, dy = best.y - cue.y, L = Math.sqrt(dx * dx + dy * dy) || 1;
    return { x: dx / L, y: dy / L };
  },
  freeSpot(P, st) {
    const cue = P.cue, kitchen = st.isBreak;
    if (poolFree(P.balls, cue.x, cue.y, kitchen)) return;
    for (let r = 0; r < 120; r += 2) for (let i = 0; i < 16; i++) {
      const x = POOL.CUE[0] + Math.cos(i * Math.PI / 8) * r, y = POOL.CUE[1] + Math.sin(i * Math.PI / 8) * r;
      if (poolFree(P.balls, x, y, kitchen)) { cue.x = x; cue.y = y; return; }
    }
  },
  aimAt(P, p) { const dx = p.x - P.cue.x, dy = p.y - P.cue.y, L = Math.sqrt(dx * dx + dy * dy); if (L > 0.8) P.aim = { x: dx / L, y: dy / L }; },
  wire(P) {
    const c = P.canvas, R = POOL.R;
    c.onpointerdown = (e) => {
      if (!P.canPlay || P.sim || G.busy) return;
      audio(); try { c.setPointerCapture(e.pointerId); } catch {}
      const p = canvasPt(P, e, POOL.RAIL), cue = P.cue;
      pgOverlay('');
      if (P.inHand && (p.x - cue.x) ** 2 + (p.y - cue.y) ** 2 < (R * 3.6) ** 2) P.mode = 'place';
      else { P.mode = 'aim'; Pool.aimAt(P, p); }
      P.draw();
    };
    c.onpointermove = (e) => {
      if (!P.mode) return;
      const p = canvasPt(P, e, POOL.RAIL);
      if (P.mode === 'place') { if (poolFree(P.balls, p.x, p.y, P.state.isBreak)) { P.cue.x = p.x; P.cue.y = p.y; } }
      else Pool.aimAt(P, p);
      P.draw();
    };
    c.onpointerup = c.onpointercancel = () => { P.mode = null; };
    const f = $('#fine'), ticks = $('#fine-ticks');
    if (f) {
      f.onpointerdown = (e) => { if (!P.canPlay || !P.aim) return; try { f.setPointerCapture(e.pointerId); } catch {} P.fx0 = e.clientX; };
      f.onpointermove = (e) => {
        if (P.fx0 == null || !P.aim) return;
        const dx = e.clientX - P.fx0; P.fx0 = e.clientX;
        const a = dx * 0.0016, cs = Math.cos(a), sn = Math.sin(a);
        const ax = P.aim.x * cs - P.aim.y * sn, ay = P.aim.x * sn + P.aim.y * cs, L = Math.sqrt(ax * ax + ay * ay);
        P.aim = { x: ax / L, y: ay / L };
        P.tick = (P.tick || 0) + dx; ticks.style.backgroundPosition = `${P.tick}px 0`;
        P.draw();
      };
      f.onpointerup = f.onpointercancel = () => { P.fx0 = null; };
    }
    const pw = $('#pw');
    if (pw) {
      const ui = () => { const h = pw.clientHeight; pw.querySelector('.pw-fill').style.height = (P.power * 100) + '%'; pw.querySelector('.pw-knob').style.transform = `translateY(${P.power * (h - 44)}px)`; };
      pw.onpointerdown = (e) => { if (!P.canPlay || P.sim || G.busy || !P.aim) return; audio(); try { pw.setPointerCapture(e.pointerId); } catch {} P.pw0 = e.clientY; P.power = 0; P.mode = null; pgOverlay(''); ui(); };
      pw.onpointermove = (e) => {
        if (P.pw0 == null) return;
        const p = Math.max(0, Math.min(1, (e.clientY - P.pw0) / (pw.clientHeight - 44)));
        if (Math.floor(p * 5) !== Math.floor(P.power * 5)) haptic();
        P.power = p; ui(); P.draw();
      };
      pw.onpointerup = () => {
        if (P.pw0 == null) return;
        P.pw0 = null; const p = P.power; P.power = 0; ui();
        if (p > 0.03) Pool.shoot(P, p); else P.draw();
      };
      pw.onpointercancel = () => { P.pw0 = null; P.power = 0; ui(); P.draw(); };
    }
  },
  play(P, balls, vx, vy, pv) {
    return new Promise((done) => {
      P.balls = balls.map((b) => ({ ...b })); P.cue = P.balls.find((b) => b.n === 0);
      P.sim = poolSim(balls, vx, vy, pv);
      P.onSimDone = (s) => { P.balls = s.B.map((b) => ({ n: b.n, x: b.x, y: b.y, on: b.on })); P.cue = P.balls.find((b) => b.n === 0); done(s); };
      pgKick();
    });
  },
  async shoot(P, p) {
    const g = G.data.game, st = g.state, me = S.me, o = opp();
    const v = POOL.VMAX * (0.1 * p + 0.9 * p * p);
    const cuePos = [r3(P.cue.x), r3(P.cue.y)];
    const startBalls = st.balls.map((b) => (b.n === 0 ? { ...b, x: cuePos[0], y: cuePos[1], on: true } : { ...b }));
    const vx = r5(P.aim.x * v), vy = r5(P.aim.y * v);
    const res = poolSim(startBalls, vx, vy, st.pv).run();
    const out = poolResolve({ ...st, balls: startBalls }, me, res);
    const move = { vx, vy, cue: cuePos };
    let summary = '';
    if (!out.keep && !out.result) summary = out.foul ? `${Pool.lastLine(out.state.last, false)}. You have ball in hand!` : `${nameOf(me)} missed. Your shot!`;
    G.busy = true; P.canPlay = false; P.inHand = false; pgOverlay('');
    const req = api('move', { id: g.id, ply: g.ply, move, state: out.state, keep: out.keep, result: out.result, summary }).then((r) => ({ r }), (e) => ({ e }));
    tone(1500, 0.035, 'square', 0.09); haptic();
    await Pool.play(P, startBalls, vx, vy, st.pv);
    const { r, e } = await req;
    G.busy = false;
    if (!G.id) return;
    if (e) { toast(errText(e), 3200); fx('err'); G.lastSig = ''; return loadGame(); }
    G.data.moves.push({ ply: g.ply, player: me, move, state_before: st });
    syncGame(r.game);
    if (r.game.status === 'finished') fx(r.game.winner === me ? 'win' : 'lose', true);
    else if (out.foul) toast(`Foul: ${Pool.lastLine(out.state.last, true).replace(/^You /, 'you ')}. ${nameOf(o)} gets ball in hand.`, 3200);
    else if (out.keep) { const a = out.state.last.assigned; toast(a ? `You're ${a}! Keep shooting` : 'Nice! Keep shooting'); }
    else toast(`${nameOf(o)}'s shot`);
    renderGame();
  },
  replay(P, g, list, done) {
    const o = opp(); let i = 0, stopped = false;
    G.anim = true; P.canPlay = false;
    pgHint(`Watching ${nameOf(o)}'s turn…`);
    const finish = () => {
      if (stopped) return; stopped = true;
      clearTimeout(P.t1); P.sim = null; P.onSimDone = null;
      G.anim = false; markSeen(g, list); pgOverlay(''); done();
    };
    P.skip = finish;
    const who = `${esc(emojiOf(o))} ${esc(nameOf(o))}`;
    const next = () => {
      if (stopped || PG !== P) return;
      if (i >= list.length) return finish();
      const m = list[i++], sb = m.state_before;
      const balls = sb.balls.map((b) => (b.n === 0 ? { ...b, x: m.move.cue[0], y: m.move.cue[1], on: true } : { ...b }));
      P.balls = balls.map((b) => ({ ...b })); P.cue = P.balls.find((b) => b.n === 0);
      pgOverlay(`${who} · Shot ${i} of ${list.length}`, true); P.draw();
      P.t1 = setTimeout(() => {
        if (stopped) return; tone(1500, 0.035, 'square', 0.09);
        Pool.play(P, balls, m.move.vx, m.move.vy, sb.pv).then(() => { if (!stopped) P.t1 = setTimeout(next, 600); });
      }, 650);
    };
    next();
  },
};

/* ========================== Game screen ========================== */
const G = { id: null, data: null, sel: null, partial: null, replay: null, busy: false, lastSig: '', chatOpen: false, lastMsgId: 0 };

function openGame(id, opts = {}) {
  G.id = id; G.data = null; G.sel = null; G.partial = null; G.replay = null; G.lastSig = ''; G.lastMsgId = 0; G.pieceEls = {};
  const cached = S.games.find((g) => g.id === id);
  if (cached) { G.data = { game: cached, moves: [], messages: [], requests: S.requests.filter((r) => r.game_id === id), partial: true }; }
  $('#g-body').innerHTML = cached ? '' : '<div class="spinner"></div>';
  const cb = $('[data-act=open-chat]'); if (cb) delete cb.dataset.n;
  if (cached) renderGame();
  $('#game').classList.add('open');
  loadGame().then(() => { if (opts.chat) openChat(); });
  startPolling();
}
function closeGame(silent) {
  $('#game').classList.remove('open');
  destroyPG(); G.busy = false;
  G.id = null; stopReplay(); closeSheet();
  if (!silent) { refreshList(); }
}
async function loadGame() {
  if (!G.id) return;
  const id = G.id;
  try {
    const r = await api('game', { id });
    if (G.id !== id) return;
    const prev = G.data && G.data.game;
    const temps = ((G.data && G.data.messages) || []).filter((m) => String(m.id).startsWith('tmp'));
    r.messages = r.messages.concat(temps);
    if (G.busy && G.data) { r.game = G.data.game; r.moves = G.data.moves; }
    G.data = r;
    // keep list cache in sync
    const i = S.games.findIndex((g) => g.id === id);
    if (i >= 0) S.games[i] = r.game; else S.games.unshift(r.game);
    S.requests = S.requests.filter((x) => x.game_id !== id).concat(r.requests.map((x) => ({ ...x, game_id: id })));
    const sig = sigOf(r.game, r.requests);
    const changed = sig !== G.lastSig && !G.busy && !G.anim;
    if (changed) {
      const theirMove = prev && r.game.ply > prev.ply && prev.turn !== S.me;
      const finishedNow = prev && prev.status !== 'finished' && r.game.status === 'finished';
      G.lastSig = sig;
      G.sel = null; G.partial = null;
      renderGame(theirMove);
      if (finishedNow) fx(r.game.winner === S.me ? 'win' : r.game.winner === 'draw' ? 'move' : 'lose', true);
    }
    // chat
    const real = r.messages.filter((m) => typeof m.id === 'number');
    const newest = real.length ? real[real.length - 1].id : 0;
    if (G.lastMsgId && newest > G.lastMsgId) {
      const fresh = real.filter((m) => m.id > G.lastMsgId && m.player !== S.me);
      if (fresh.length) { if (G.chatOpen) sfx('msg'); else { fx('msg'); toast(`${emojiOf(opp())} ${fresh[fresh.length - 1].body.slice(0, 60)}`); } }
    }
    G.lastMsgId = newest;
    S.unread[id] = r.messages.filter((m) => m.player !== S.me && !m.read_at).length;
    if (G.chatOpen) { renderChat(); if (S.unread[id]) markRead(); }
    updateChatBadge(); updateBadges();
  } catch (e) {
    if (e.status === 404) { S.games = S.games.filter((x) => x.id !== id); toast('That game was deleted.'); closeGame(); }
  }
}
function chatInner(n) { return `${I.chat} Chat${n ? `<span class="badge">${n}</span>` : ''}`; }
function chatBtn() { const n = (G.id && S.unread[G.id]) || 0; return `<button class="btn chat-btn" data-act="open-chat" data-n="${n}">${chatInner(n)}</button>`; }
function updateChatBadge() {
  const n = (G.id && S.unread[G.id]) || 0;
  $$('[data-act=open-chat]').forEach((b) => { if (b.dataset.n === String(n)) return; b.dataset.n = n; b.innerHTML = chatInner(n); });
}

function myColor(g) { return g.state && g.state.colors ? g.state.colors[S.me] : 'r'; }

function renderGame(animateTheirMove) {
  const d = G.data; if (!d) return;
  const g = d.game, me = S.me, o = opp();
  destroyPG();
  $('#g-title').textContent = GNAME[g.type] || g.type;
  $('#g-more').style.visibility = g.status === 'active' || g.status === 'finished' ? 'visible' : 'hidden';
  // second line only when there's a turn timer (the players are already in the score bar)
  let sub = g.options && g.options.timer ? (g.options.timer === 24 ? '1-day turns' : '3-day turns') : '';
  if (sub && g.status === 'active' && g.turn_deadline) sub += ' · ' + left(g.turn_deadline);
  $('#g-sub').textContent = sub;
  updateChatBadge();

  if (g.status === 'invited') return renderInvite(g);
  if (!stateOk(g)) { renderBroken(g); return addDeleteBanner(); }
  if (g.type === 'golf') { Golf.render(g); return addDeleteBanner(); }
  if (g.type === 'pool') { Pool.render(g); return addDeleteBanner(); }

  const myC = myColor(g), oC = myC === 'r' ? 'k' : 'r';
  const st = G.replay ? G.replay.frames[G.replay.i] : g.state;
  const board = st.board;
  const isMyTurn = g.status === 'active' && g.turn === me && !G.replay;
  const pbar = (p, c, mine) => {
    const active = g.status === 'active' && g.turn === p && !G.replay;
    const lost = 12 - CK.count(board, c === 'r' ? 'k' : 'r');
    return `<div class="pbar glass ${active ? 'turn' : ''}">
      <div class="av">${esc(emojiOf(p))}</div>
      <div class="grow"><div class="nm">${mine ? 'You' : esc(nameOf(p))}</div>
        <div class="meta"><span class="chip-dot" style="background:${c === 'r' ? '#e02b48' : '#22252f'}"></span>${c === 'r' ? 'Red' : 'Black'} · captured ${lost}</div></div>
      ${active ? `<span class="pill">${mine ? 'Your move' : 'Their move'}</span>` : ''}
    </div>`;
  };

  let banner = '';
  const req = d.requests.find((r) => r.kind !== 'delete');
  if (g.status === 'active' && req && !G.replay) {
    if (req.from_player !== me) {
      banner = `<div class="banner glass"><div class="msg">${esc(emojiOf(o))} ${req.kind === 'undo' ? `${esc(nameOf(o))} wants to take back their last move` : `${esc(nameOf(o))} offered a draw`}</div>
        <div class="acts"><button class="btn" data-answer="0" data-req="${req.id}">${req.kind === 'undo' ? 'Deny' : 'Decline'}</button>
        <button class="btn primary" data-answer="1" data-req="${req.id}">${req.kind === 'undo' ? 'Allow' : 'Accept draw'}</button></div></div>`;
    } else {
      banner = `<div class="banner glass"><div class="msg">${req.kind === 'undo' ? 'Undo requested' : 'Draw offered'} · waiting on ${esc(nameOf(o))}</div>
        <div class="acts"><button class="btn" data-act="cancel-req" data-req="${req.id}">Cancel request</button></div></div>`;
    }
  }
  if (g.status === 'finished' && !G.replay) {
    const won = g.winner === me, draw = g.winner === 'draw';
    const why = g.end_reason === 'resign' ? (won ? `${nameOf(o)} resigned` : 'You resigned') : g.end_reason === 'timeout' ? (won ? `${nameOf(o)}'s timer ran out` : 'Your timer ran out') : draw ? 'Agreed to a draw' : '';
    banner = `<div class="banner glass result"><div class="big">${draw ? '🤝' : won ? '🏆' : esc(emojiOf(o))}</div>
      <b>${draw ? "It's a draw" : won ? 'You won!' : `${esc(nameOf(o))} won`}</b><div class="sub">${esc(why)}</div></div>`;
  }

  let actions = '';
  if (G.replay) {
    const R = G.replay;
    actions = `<div class="replay glass">
      <button class="icon-btn press" data-rp="first">${I.first}</button><button class="icon-btn press" data-rp="prev">${I.prev}</button>
      <div class="pos">${R.i === 0 ? 'Start' : `Move ${R.i} of ${R.frames.length - 1}`}</div>
      <button class="icon-btn press" data-rp="play">${R.timer ? I.pause : I.play}</button>
      <button class="icon-btn press" data-rp="next">${I.next}</button><button class="icon-btn press" data-rp="last">${I.last}</button>
    </div><div class="actions"><button class="btn" data-act="replay-done">Done</button></div>`;
  } else if (g.status === 'active') {
    const lastMine = d.moves.length ? d.moves[d.moves.length - 1].player === me : (g.turn !== me && g.ply > 0);
    const canUndo = g.turn !== me && g.ply > 0 && lastMine && !d.requests.length;
    const canNudge = g.turn !== me && (!g.nudged_at || Date.now() - new Date(g.nudged_at) > 3600e3);
    actions = `<div class="actions">
      ${g.turn !== me ? `<button class="btn" data-act="nudge" ${canNudge ? '' : 'disabled'}>👋 Nudge</button>` : ''}
      ${canUndo ? `<button class="btn" data-act="req-undo">${I.undo} Take back</button>` : ''}
      ${chatBtn()}
    </div>`;
  } else if (g.status === 'finished') {
    actions = `<div class="actions"><button class="btn primary" data-act="rematch">🔁 Rematch</button>
      ${d.moves.length ? `<button class="btn" data-act="replay">${I.play} Replay</button>` : ''}${chatBtn()}</div>`;
  }

  const hints = !!(g.options && g.options.hints);
  $('#g-body').innerHTML = `${pbar(o, oC, false)}${banner}
    <div class="board-wrap glass"><div class="board" id="board"></div></div>
    ${pbar(me, myC, true)}${actions}`;
  drawBoard(st, { flip: myC === 'k', interactive: isMyTurn, hints, animate: animateTheirMove, color: myC });
  if (animateTheirMove && g.state.last) fx(g.state.last.caps && g.state.last.caps.length ? 'capture' : 'move');
  addDeleteBanner();
}
// "Delete this game?" asks the other player first. Shown at the top of any game while it's waiting.
const delReq = () => (G.data && G.data.requests || []).find((r) => r.kind === 'delete');
function addDeleteBanner() {
  const r = delReq(), body = $('#g-body'); if (!r || !body || G.replay) return;
  const o = opp(), el = document.createElement('div');
  el.className = 'banner glass'; el.id = 'del-banner';
  el.innerHTML = r.from_player !== S.me
    ? `<div class="msg">🗑️ ${esc(nameOf(o))} wants to delete this game. It'll be gone for both of you, chat included.</div>

    : `<div class="msg">🗑️ Asked ${esc(nameOf(o))} to delete this game · waiting on them</div>
       <div class="acts"><button class="btn" data-act="cancel-req" data-req="${r.id}">Cancel request</button></div>`;
  body.prepend(el);
}

function stateOk(g) {
  const s = g.state; if (!s) return false;
  if (g.type === 'golf') return !!(s.scores && Array.isArray(s.scores.a) && Array.isArray(s.scores.b));
  if (g.type === 'pool') return Array.isArray(s.balls) && !!s.groups;
  if (g.type === 'checkers') return Array.isArray(s.board);
  return true;
}
function renderBroken(g) {

  $('#g-body').innerHTML = `${fin ? resultBanner(g) : ''}<div class="glass card" style="text-align:center;padding:24px 18px">
      <div style="font-size:40px">🧩</div><b style="font-size:18px">This game didn't start right</b>
      <p class="sub" style="margin:6px 0 0">It was set up by an older version of Volley${fin ? '.' : ', so it can\'t be played. Resign it and start a fresh one.'}</p></div>
    <div class="actions">${fin ? '' : `<button class="btn danger" data-act="resign">${I.flag} Resign</button>`}${chatBtn()}</div>`;
}
function renderInvite(g) {
  const me = S.me, o = opp(), incoming = g.created_by !== me;
  let t = g.options.timer ? (g.options.timer === 24 ? '1 day per turn' : '3 days per turn') : 'No turn timer';
  if (g.type === 'golf') { const n = g.options.holes || 9, mx = g.options.max != null ? g.options.max : 8; t = `${n} holes · ${mx ? `max ${mx} strokes` : 'no stroke limit'} · ` + t; }
  G.acceptHints = g.options.hints;
  $('#g-body').innerHTML = `<div class="glass card" style="text-align:center;padding:26px 18px;margin-top:12px">
      <div class="thumb" style="width:96px;height:96px;margin:0 auto 14px;border-radius:22px">${thumb(g)}</div>
      <h2 style="justify-content:center;margin:0 0 4px;font-size:13px">${incoming ? 'Game invite' : 'Invite sent'}</h2>
      <div style="font-size:22px;font-weight:750">${incoming ? `${esc(emojiOf(o))} ${esc(nameOf(o))} wants to play ${GNAME[g.type]}` : `Waiting on ${esc(nameOf(o))} ${esc(emojiOf(o))}`}</div>
      <p class="sub" style="margin:6px 0 0">${t}${g.rematch_of ? ' · Rematch' : ''}</p>
    </div>
    ${g.options.hints ? `<div class="group glass">${incoming
      ? `<button class="item" data-act="accept-hints"><span class="lbl">Move hints<div class="sub" style="font-weight:400;font-size:13px">${esc(nameOf(o))} turned these on. Keep them?</div></span><span class="switch on" id="acc-hints"></span></button>`
      : `<div class="item"><span class="lbl">Move hints</span><span class="val">On if ${esc(nameOf(o))} keeps them</span></div>`}</div>` : ''}
    <div class="actions" style="margin-top:6px">${incoming
      ? `<button class="btn" data-act="decline">Decline</button><button class="btn primary" data-act="accept" style="min-width:150px">Accept</button>`
      : `<button class="btn" data-act="nudge" ${!g.nudged_at || Date.now() - new Date(g.nudged_at) > 3600e3 ? '' : 'disabled'}>👋 Nudge</button><button class="btn danger" data-act="cancel-invite">Cancel invite</button>`}${chatBtn()}</div>`;
}

/* ---------- Board drawing + input ---------- */
function sqToDisp(i, flip) { let r = i >> 3, c = i & 7; if (flip) { r = 7 - r; c = 7 - c; } return [r, c]; }
function drawBoard(st, o) {
  const el = $('#board'); if (!el) return;
  G.view = o;
  let html = '';
  for (let dr = 0; dr < 8; dr++) for (let dc = 0; dc < 8; dc++) {
    const r = o.flip ? 7 - dr : dr, c = o.flip ? 7 - dc : dc, i = r * 8 + c;
    html += `<div class="sq ${(r + c) % 2 ? 'd' : ''}" data-i="${i}"></div>`;
  }
  el.innerHTML = html + '<div class="pieces" id="pieces"></div>';
  G.pieceEls = {};
  // animate their move: start from the board before it, then hop along the path
  const last = st.last;
  if (o.animate && last && G.data.moves.length) {
    const before = G.data.moves[G.data.moves.length - 1].state_before;
    if (before && before.board) {
      placePieces(before.board);
      requestAnimationFrame(() => requestAnimationFrame(() => animatePath(last, before.board, st.board)));
      highlight(st);
      el.onclick = (e) => onBoardTap(e);
      return;
    }
  }
  placePieces(st.board);
  highlight(st);
  el.onclick = (e) => onBoardTap(e);
}
function pieceHTML(p) { return `<i>${p.k ? I.crown : ''}</i>`; }
function posStyle(i) { const [r, c] = sqToDisp(i, G.view.flip); return `translate(${c * 100}%, ${r * 100}%)`; }
function placePieces(board) {
  const layer = $('#pieces'); if (!layer) return;
  const seen = new Set();
  board.forEach((p, i) => {
    if (!p) return; seen.add(p.id);
    let e = G.pieceEls[p.id];
    if (!e) { e = document.createElement('div'); layer.appendChild(e); G.pieceEls[p.id] = e; }
    e.className = 'pc ' + p.c; e.dataset.k = p.k ? 1 : 0;
    e.innerHTML = pieceHTML(p); e.style.transform = posStyle(i); e.style.opacity = 1;
  });
  for (const id in G.pieceEls) if (!seen.has(id)) { G.pieceEls[id].remove(); delete G.pieceEls[id]; }
}
const elAt = (board, sq) => board && board[sq] ? G.pieceEls[board[sq].id] : null;
function animatePath(m, beforeBoard, finalBoard) {
  const mover = elAt(beforeBoard, m.path[0]);
  const steps = m.path.slice(1);
  let k = 0;
  const hop = () => {
    if (!$('#pieces')) return;
    if (k >= steps.length) { setTimeout(() => placePieces(finalBoard), 60); return; }
    if (mover) mover.style.transform = posStyle(steps[k]);
    const from = k ? steps[k - 1] : m.path[0], to = steps[k];
    if (Math.abs((to >> 3) - (from >> 3)) === 2) {
      const ce = elAt(beforeBoard, (from + to) / 2);
      if (ce) setTimeout(() => (ce.style.opacity = 0), 120);
    }
    k++; setTimeout(hop, 240);
  };
  hop();
}
function highlight(st) {
  const el = $('#board'); if (!el) return;
  $$('.sq', el).forEach((s) => s.classList.remove('sel', 'dest', 'last', 'must'));
  const last = st.last;
  if (last && last.path) last.path.forEach((i) => { const s = $(`.sq[data-i="${i}"]`, el); if (s) s.classList.add('last'); });
  if (!G.view.interactive) return;
  const mv = currentMoves();
  if (G.sel != null) {
    const s = $(`.sq[data-i="${G.sel}"]`, el); if (s) s.classList.add('sel');
    if (G.view.hints) destsFor(mv).forEach((i) => { const d = $(`.sq[data-i="${i}"]`, el); if (d) d.classList.add('dest'); });
  } else if (G.view.hints && mv.length && mv[0].caps.length) {
    [...new Set(mv.map((m) => m.path[0]))].forEach((i) => { const s = $(`.sq[data-i="${i}"]`, el); if (s) s.classList.add('must'); });
  }
}
function legalMoves() { const g = G.data.game; return CK.moves(g.state.board, myColor(g)); }
function currentMoves() {
  const all = legalMoves();
  if (!G.partial) return all;
  return all.filter((m) => G.partial.every((x, i) => m.path[i] === x));
}
function destsFor(mv) {
  const len = G.partial ? G.partial.length : 1;
  return [...new Set(mv.filter((m) => G.sel == null || m.path[len - 1] === G.sel).map((m) => m.path[len]).filter((x) => x != null))];
}
function shakeBoard() { const b = $('#board'); if (!b) return; b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); }

function onBoardTap(e) {
  const sq = e.target.closest('.sq'); if (!sq || !G.view || !G.view.interactive || G.busy) return;
  const i = Number(sq.dataset.i), g = G.data.game, board = g.state.board, color = myColor(g);
  const all = legalMoves();
  // Mid multi-jump: only the next landing square counts
  if (G.partial && G.partial.length > 1) {
    const cand = currentMoves().filter((m) => m.path[G.partial.length] === i);
    if (!cand.length) { shakeBoard(); fx('err'); if (G.partial.length > 1) toast('Keep jumping with the same piece'); return; }
    return stepTo(i, cand);
  }
  const p = board[i];
  if (p && p.c === color) {
    const mine = all.filter((m) => m.path[0] === i);
    if (!mine.length) {
      shakeBoard(); fx('err');
      if (all.length && all[0].caps.length) toast('You have to jump when you can');
      G.sel = null; G.partial = null; highlight(g.state); return;
    }
    G.sel = i; G.partial = [i]; fx('tap'); liftSel(); highlight(g.state); return;
  }
  if (G.sel != null) {
    const cand = currentMoves().filter((m) => m.path[1] === i);
    if (!cand.length) { shakeBoard(); fx('err'); return; }
    return stepTo(i, cand);
  }
}
function liftSel() {
  Object.values(G.pieceEls).forEach((e) => e.classList.remove('lift'));
  if (!G.partial) return;
  const e = elAt(G.data.game.state.board, G.partial[0]);
  if (e) e.classList.add('lift');
}
function stepTo(i, cand) {
  const board = G.data.game.state.board;
  const from = G.partial[G.partial.length - 1];
  const pieceEl = elAt(board, G.partial[0]);
  G.partial.push(i);
  const full = cand.find((m) => m.path.length === G.partial.length);
  if (pieceEl) pieceEl.style.transform = posStyle(i);
  if (Math.abs((i >> 3) - (from >> 3)) === 2) {
    const ce = elAt(board, (from + i) / 2);
    if (ce) setTimeout(() => (ce.style.opacity = 0), 100);
    fx('capture');
  } else fx('move');
  if (full) { G.sel = null; commitMove(full); }
  else { G.sel = i; highlight(G.data.game.state); liftSel(); }
}

async function commitMove(m) {
  const g = G.data.game, color = myColor(g), oc = color === 'r' ? 'k' : 'r';
  const { board, crowned } = CK.apply(g.state.board, m);
  const newState = { ...g.state, board, last: { path: m.path, caps: m.caps } };
  const theirMoves = CK.moves(board, oc);
  const result = theirMoves.length ? null : { winner: S.me };
  G.busy = true; G.partial = null; G.sel = null;
  if (crowned) setTimeout(() => fx('king', true), 200);
  const snapshot = JSON.parse(JSON.stringify(G.data));
  // optimistic
  const before = g.state;
  G.data.game = { ...g, state: newState, ply: g.ply + 1, turn: result ? null : opp(), status: result ? 'finished' : 'active', winner: result ? S.me : null, end_reason: result ? 'win' : null, last_move_at: new Date().toISOString() };
  G.data.moves = G.data.moves.concat([{ ply: g.ply, player: S.me, move: m, state_before: before }]);
  setTimeout(() => { G.busy = false; renderGame(false); if (result) fx('win', true); }, 260);
  try {
    const r = await api('move', { id: g.id, ply: g.ply, move: { path: m.path, caps: m.caps }, state: newState, result });
    G.data.game = r.game;
    const i = S.games.findIndex((x) => x.id === g.id); if (i >= 0) S.games[i] = r.game;
    G.lastSig = '';
    updateBadges();
  } catch (e) {
    G.data = snapshot; G.busy = false;
    toast(errText(e), 3000); fx('err');
    await loadGame(); renderGame();
  }
}

/* ---------- Replay ---------- */
function startReplay() {
  const d = G.data; const frames = d.moves.map((m) => m.state_before).concat([d.game.state]);
  G.replay = { frames, i: 0, timer: null };
  renderGame();
}
function stopReplay() { if (G.replay && G.replay.timer) clearInterval(G.replay.timer); G.replay = null; }
function replayGo(i) {
  const R = G.replay; if (!R) return;
  R.i = Math.max(0, Math.min(R.frames.length - 1, i));
  if (R.i === R.frames.length - 1 && R.timer) { clearInterval(R.timer); R.timer = null; }
  const fr = R.frames[R.i];
  const posEl = $('.replay .pos'); if (posEl) posEl.textContent = R.i === 0 ? 'Start' : `Move ${R.i} of ${R.frames.length - 1}`;
  const pb = $('[data-rp=play]'); if (pb) pb.innerHTML = R.timer ? I.pause : I.play;
  // show highlight of the move that led here
  const st = { ...fr, last: R.i > 0 ? G.data.moves[R.i - 1].move : null };
  placePieces(fr.board); highlight(st); sfx('move');
}

// iPhone "Shake to Undo": iOS offers to undo the last thing you typed (a chat message, the passcode)
// whenever you shake, even in a game. Throwing away the text boxes once you're done with them drops
// that typing history, so the prompt has nothing to offer.
function forgetTyping() {
  const a = document.activeElement; if (a && a.blur && /^(INPUT|TEXTAREA)$/.test(a.tagName)) a.blur();
  setTimeout(() => { if (!$('#sheet').classList.contains('open')) $('#sheet').innerHTML = ''; }, 420);

function openChat() {
  if (!G.id) return;

  openSheet(`<div class="grab"></div><h3>${esc(emojiOf(opp()))} Chat with ${esc(nameOf(opp()))}</h3>
    <div class="msgs" id="msgs"></div>

    <button class="send press" type="submit" aria-label="Send">${I.send}</button></form>`, 'chat');
  renderChat(true);
  let ta = $('#msg');
  const wireBox = (el) => {
    el.addEventListener('input', () => { el.style.height = 'auto'; el.style.height = Math.min(120, el.scrollHeight) + 'px'; });
    el.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !('ontouchstart' in window)) { e.preventDefault(); $('#composer').requestSubmit(); } });

    'req-delete-yes': () => run(async () => { closeSheet(); await api('request', { id: G.id, kind: 'delete' }); toast(`Asked ${nameOf(opp())} to delete it`); fx('sent'); G.lastSig = ''; await loadGame(); }),
    'req-draw': () => run(async () => { closeSheet(); await api('request', { id: G.id, kind: 'draw' }); toast('Draw offered'); G.lastSig = ''; await loadGame(); }),
    'cancel-req': () => run(async () => { await api('cancel_request', { request_id: Number(t.dataset.req) }); G.lastSig = ''; await loadGame(); }),
    'resign': () => confirmSheet('Resign this game?', `${nameOf(opp())} gets the win.`, 'Resign', 'resign-yes', true),
    'resign-yes': () => run(async () => { closeSheet(); const r = await api('resign', { id: G.id }); G.data.game = r.game; G.lastSig = ''; fx('lose', true); await loadGame(); }),
    'rematch': () => run(async () => {
      t.disabled = true;
      const r = await api('rematch', { id: G.id });
      if (!S.games.find((x) => x.id === r.game.id)) S.games.unshift(r.game);
      if (!r.existing) { toast(`Rematch invite sent`); fx('sent'); }
      openGame(r.game.id);
    }),
    'replay': () => { fx('tap'); startReplay(); },
    'pg-zoom': () => { if (PG && PG.type === 'golf') { fx('tap'); PG.overview = !PG.overview; PG.userZoom = PG.overview; Golf.zoomBtn(PG); pgKick(); } },
    'pg-skip': () => { if (PG && PG.skip) { fx('tap'); PG.skip(); } },
    'watch-last': () => { fx('tap'); G.forceReplay = true; renderGame(); },
    'scorecard': () => { fx('tap'); openSheet(`<div class="grab"></div><h3>Scorecard</h3>${golfCard(G.data.game.state)}<div class="menu" style="margin-top:14px"><button class="btn" data-act="close-sheet">Done</button></div>`); },
    'replay-done': () => { stopReplay(); renderGame(); },
  };
  if (A[act]) A[act]();
});
$('#backdrop').onclick = closeSheet;

/* ========================== Polling + focus ========================== */
let pollT = null, listT = null;
function startPolling() {
  stopPolling();
  pollT = setInterval(() => { if (document.visibilityState === 'visible' && G.id) loadGame(); }, 5000);
  listT = setInterval(() => { if (document.visibilityState === 'visible' && !G.id) refreshList(); }, 20000);
}
function stopPolling() { clearInterval(pollT); clearInterval(listT); }
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || !S.me || !S.key) return;
  if (G.id) loadGame(); refreshList();
});
setInterval(() => { if (S.me && S.tab === 'games' && !G.id && document.visibilityState === 'visible') renderGames(); }, 60000);

function handleUrl(url) {
  try {
    const u = new URL(url, location.origin);
    const id = u.searchParams.get('g');
    if (id) { openGame(id, { chat: u.searchParams.get('chat') === '1' }); history.replaceState(null, '', '/'); }
  } catch {}
}

/* ========================== Boot ========================== */
function startApp() {
  try { const t = sessionStorage.getItem('volley.tab'); if (t) { S.tab = t; sessionStorage.removeItem('volley.tab'); } } catch {}
  $('#tabs').hidden = false; setupTabs(); setTab(S.tab || 'games');
  $('[data-act=close-game]').innerHTML = I.back; $('#g-more').innerHTML = I.more;
  refreshList(); startPolling(); paintTestPill();
  subscribePush(false).catch(() => {}); // refresh this phone's subscription if notifications are already allowed
  handleUrl(location.href);
}
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
  navigator.serviceWorker.addEventListener('message', (e) => {
    const m = e.data || {};
    if (m.type === 'open' && m.url) handleUrl(m.url);
    if (m.type === 'push' && S.me) { if (G.id) loadGame(); refreshList(); }
  });
}
(async function boot() {
  if (!S.key) return gatePasscode();
  if (testMode() && !S.me) { S.me = 'a'; store.set('me', 'a'); }
  if (!S.me) {
    try { const r = await call('/api/db', 'hello'); S.players = r.players; S.vapid = r.vapid; } catch (e) { if (e.status === 401) return gatePasscode(); }
    return gateWho();
  }
  startApp();
})();
</script>
